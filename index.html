<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f1ece3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2c2925" media="(prefers-color-scheme: dark)">
<title>ゲームポータル</title>
<link rel="manifest" href="manifest.json?v=8">
<link rel="icon" href="favicon-v4.png">
<link rel="apple-touch-icon" href="apple-touch-icon-v4.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f1ece3;--panel:#fbf8f2;--line:#d3cbbd;--fg:#3a332b;--muted:#8a8073;--btn:#b9b0a2;--accent:#d9822b;--num:#d9822b;--numTx:#fff;--ring:#d9822b}
@media (prefers-color-scheme:dark){:root{--bg:#2c2925;--panel:#36322d;--line:#544d44;--fg:#eee8df;--muted:#a59b8e;--btn:#6a6258;--accent:#e0913f;--num:#d9822b;--numTx:#fff;--ring:#f0a650}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg)}
body{background-image:radial-gradient(rgba(120,100,70,.07) 1.2px,transparent 1.4px);background-size:14px 14px}
body{font-family:"Segoe UI",Roboto,"Hiragino Sans","Noto Sans JP",sans-serif}
/* pinned to the area we really get (100vh can reach under the phone's ◁○≡ bar) */
#root{position:fixed;inset:0;overflow-y:auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;background:var(--panel);border:2px solid var(--btn);border-radius:12px;cursor:pointer}
button:active{transform:scale(.97)}
.wrap{max-width:520px;min-height:100%;margin:0 auto;padding:14px 16px 18px;display:flex;flex-direction:column}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 12px}
.head h1{margin:0;font-size:21px;font-weight:900;letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head h1 i{display:inline-block;width:10px;height:10px;margin-right:4px;border-radius:3px;vertical-align:middle;transform:rotate(12deg)}
.head button{width:46px;height:46px;flex:none;font-size:22px;padding:0}
.hbtns{display:flex;gap:8px;flex:none}
.toast{position:fixed;left:50%;white-space:nowrap;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:40;max-width:88vw;padding:12px 18px;border-radius:14px;background:var(--fg);color:var(--bg);font-size:15px;font-weight:700;text-align:center;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* the stage: the picked game, big */
.stage{position:relative;flex:1;min-height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 18px 22px;border-radius:28px;overflow:hidden;
  background:var(--sb);color:var(--st);box-shadow:0 10px 24px rgba(0,0,0,.16);transition:background .35s,color .35s;touch-action:pan-y}
.stage::before{content:"";position:absolute;inset:0;opacity:.13;background-image:var(--pat);background-size:44px 44px;pointer-events:none}
.stage>*{position:relative}
.stage .art{width:min(46vw,190px);aspect-ratio:1;border-radius:30px;box-shadow:0 12px 22px rgba(0,0,0,.28);background:var(--lb);display:flex;align-items:center;justify-content:center;font-size:min(26vw,104px);overflow:hidden}
.stage .art img{width:100%;height:100%;object-fit:cover;display:block}
.stage h2{margin:20px 0 4px;font-size:32px;font-weight:900;letter-spacing:.03em}
.stage p{margin:0;font-size:16.5px;opacity:.86}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}
.tags span{padding:5px 12px;border-radius:99px;font-size:14.5px;font-weight:700;background:rgba(255,255,255,.2);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.28)}
.stage.lightbg::before{opacity:.07}
.stage.lightbg .tags span{background:rgba(0,0,0,.06);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.12)}
.stage .in{animation:in .32s ease both}
.stage .in.l{animation-name:inL}.stage .in.r{animation-name:inR}.stage .in.none{animation:none}
@keyframes in{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-28px)}to{opacity:1;transform:none}}
@keyframes inR{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
.soonTag{position:absolute;top:16px;right:16px;padding:5px 12px;border-radius:99px;background:var(--accent);color:#fff;font-size:14px;font-weight:800}
/* picker: one tile per game */
.pick{display:flex;justify-content:center;gap:14px;margin:16px 0 14px;padding:8px 8px 0}
.tile{flex:1 1 0;min-width:0;max-width:84px;background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--fg)}
.tile .ic{width:100%;aspect-ratio:1;border-radius:22px;overflow:hidden;background:var(--lb);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 3px 8px rgba(0,0,0,.16);transition:transform .2s,box-shadow .2s;outline:4px solid transparent;outline-offset:3px}
.tile .ic img{width:100%;height:100%;object-fit:cover;display:block}
.tile small{display:block;width:100%;font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.2;word-break:keep-all;overflow-wrap:normal;white-space:normal}
.tile .tv{margin-top:-4px;font-size:12px;font-weight:600;color:var(--muted);opacity:.85;min-height:1.2em}
.stage .sv{display:inline-block;margin-top:12px;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:700;opacity:.75;box-shadow:inset 0 0 0 1.5px currentColor}
.tile.on .ic{transform:translateY(-4px);outline-color:var(--ring);box-shadow:0 8px 14px rgba(0,0,0,.2)}
.tile.on small{color:var(--fg)}
.tile.soon .ic{filter:saturate(.5);opacity:.75}
.play{width:100%;height:64px;font-size:22px;font-weight:900;letter-spacing:.1em;border:0;border-radius:18px;background:var(--pb);color:var(--pt);box-shadow:0 5px 0 var(--pd)}
.play:active{transform:translateY(3px);box-shadow:0 2px 0 var(--pd)}
.play:disabled{background:var(--btn);box-shadow:none;opacity:.6;letter-spacing:.04em}
.ver{margin-top:12px;text-align:center;font-size:12.5px;color:var(--muted)}
.ver button{background:none;border:0;padding:6px 10px;font:inherit;color:inherit}
.ver button.new{color:var(--accent);font-weight:700}
.chip{display:inline-block;padding:3px 12px;border-radius:99px;background:rgba(127,127,127,.18);font-size:14px;font-weight:700}
.newb{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:99px;background:var(--accent);color:#fff;font-size:11px;font-weight:800;vertical-align:2px}
.newb.hidden{display:none}
.rowBtn{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;font:inherit;font-size:16px;color:var(--fg);text-align:left}
.rowBtn .rs{color:var(--muted);font-size:14px}
.chg h3{font-size:16px;margin:12px 0 4px;color:var(--accent)}
.chg ul{margin:0;padding-left:20px;font-size:15px;line-height:1.7}
.chg details{margin:0 0 4px}
.chg summary{font-size:15px;color:var(--muted);padding:8px 0;cursor:pointer}
/* overlays */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{width:100%;max-width:520px;max-height:92vh;overflow:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 12px;text-align:center;font-size:21px}
.cs{font-size:15.5px;line-height:1.65}.cs p{margin:0 0 6px}.cs h3{font-size:16px;margin:14px 0 4px}.cs ul{margin:0;padding-left:1.3em}.cs li{margin:2px 0}
.csChk{display:flex;align-items:center;gap:12px;margin:18px 0 12px;padding:14px;border:2px solid var(--btn);border-radius:12px;font-size:17px;font-weight:700}
.csChk input{width:26px;height:26px;accent-color:var(--num);flex:none;margin:0}
.pri{width:100%;height:56px;font-size:19px;font-weight:800;background:var(--num);border-color:var(--num);color:var(--numTx)}
.pri:disabled{opacity:.35}
.plain{display:block;margin:10px auto 0;background:none;border:0;color:var(--muted);font-size:16px;text-decoration:underline;padding:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line);font-size:17px}
.seg{display:flex;gap:6px}.seg button{min-width:64px;height:42px;font-size:15px}.seg button.on{background:var(--num);border-color:var(--num);color:var(--numTx)}
/* first screen: add to home */
#inst{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px 20px}
#inst.on{display:flex}
#inst .box{width:100%;max-width:400px;text-align:center}
#inst img{width:96px;height:96px;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.15);margin-bottom:14px}
#inst h1{margin:0 0 18px;font-size:30px;letter-spacing:.12em}
#inst .lead{margin:0 0 18px;font-size:20px;font-weight:700;line-height:1.5}
.fx{list-style:none;margin:4px 0 26px;padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);text-align:left}
.fx li{display:flex;align-items:center;gap:12px;font-size:16px;line-height:1.5;padding:6px 0}.fx span{font-size:22px;width:28px;text-align:center}
.a2h{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0 4px;font-size:16px}.a2h b{padding:6px 10px;border:1.5px solid var(--btn);border-radius:10px;background:var(--panel)}
.a2note{margin:0;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<div id="root"><div class="wrap">
  <div class="head"><h1 id="ttl"></h1><div class="hbtns"><button id="shareBtn" aria-label="ゲームポータルを教える">📤</button><button id="setBtn" aria-label="設定">⚙</button></div></div>
  <div class="toast" id="toast"></div>
  <div class="stage" id="stage"></div>
  <div class="pick" id="pick"></div>
  <button class="play" id="play">▶ あそぶ</button>
  <div class="ver" id="ver"></div>
</div></div>

<!-- add to home screen (browser only) -->
<div id="inst"><div class="box">
  <img src="icon-192-v4.png" alt="">
  <h1 id="instTtl"></h1>
  <p class="lead">ホーム画面にアイコンを追加して<br>アプリとして遊びましょう</p>
  <ul class="fx"><li><span>📱</span>フルスクリーンでプレイできます</li><li><span>🎮</span>アイコン1つで全部のゲームが遊べます</li><li><span>✨</span>新しいゲームも自動で増えます</li></ul>
  <button class="pri" id="instGo">📲 ホーム画面に追加</button>
  <div id="instSteps"></div>
  <button class="plain" id="instSkip">今はブラウザで遊ぶ</button>
</div></div>

<!-- consent (shared by every game) -->
<!-- what's new -->
<div class="ov" id="clOv"><div class="sheet">
  <h2>📋 更新内容</h2>
  <p style="text-align:center;margin:0 0 6px"><span class="chip" id="chgVer"></span></p>
  <div class="chg" id="chgBody"></div>
  <button class="plain" id="clClose">戻る</button>
</div></div>

<!-- settings -->
<div class="ov" id="setOv"><div class="sheet">
  <h2>⚙ 設定</h2>
  <div class="row">プレイ記録を送る<div class="seg" id="shareSeg"><button data-v="1">ON</button><button data-v="0">OFF</button></div></div>
  <div class="row"><button class="plain" id="csInfo" style="margin:0;padding:6px 0">送信内容について ›</button></div>
  <button class="rowBtn" id="shareRow"><span>📤 ゲームポータルを教える</span><span class="rs">›</span></button>
  <button class="rowBtn" id="clInfo" style="border:0"><span>📋 更新内容<span class="newb hidden" id="stVerNew">NEW</span></span><span class="rs">v<span id="stVerNo"></span> ›</span></button>
  <button class="plain" id="setClose">閉じる</button>
</div></div>

<script>
(function(){
var CHANGELOG = [
  {v:'0.6.4', d:'2026-11-28', items:['📝 プレイ記録の送信の同意を、すべてのゲームで同じ画面・同じ内容にそろえました（たわーばとるも追加）']},
  {v:'0.6.3', d:'2026-11-28', items:['🧱 たわーばとるのアイコンを新しくしました']},
  {v:'0.6.2', d:'2026-11-28', items:['🔤 ゲームの名前が、へんなところで折り返さないようにしました']},
  {v:'0.6.1', d:'2026-11-28', items:['🔲 ゲームのアイコンの大きさを、どれも同じにそろえました']},
  {v:'0.6.0', d:'2026-11-28', items:['🧱 たわーばとるが遊べるようになりました（なんでも積みあげる、ほのぼのタワーバトル。ネット対戦もできます）']},
  {v:'0.5.7', d:'2026-11-23', items:['📤 ゲームポータルを教えるボタンを付けました（右上の📤、または設定から）']},
  {v:'0.5.6', d:'2026-11-23', items:['🔀 ゲームの並びを、作った順（Dungeon Chain・KROPKI・LAPIS）にしました']},
  {v:'0.5.5', d:'2026-11-23', items:['🔢 それぞれのゲームのいまのバージョンを、ポータルに表示するようにしました（更新が届いたか分かります）']},
  {v:'0.5.4', d:'2026-11-23', items:['📋 更新内容の見せ方を、ほかのゲームとそろえました']},
  {v:'0.5.3', d:'2026-11-23', items:['🌀 アプリのアイコンを、ゲームの世界へつながるワープゲートのデザインにしました']},
  {v:'0.5.1', d:'2026-11-23', items:['📝 ポータルの更新内容を見られるようにしました（設定と、いちばん下のバージョン表示から）']},
  {v:'0.5.0', d:'2026-11-23', items:['🏷️ 名前を「ゲームポータル」に変えました']},
  {v:'0.4.6', d:'2026-11-23', items:['🖼️ アプリのアイコンを、3つのゲームの札を手に持ったデザインにしました','🏷️ ゲームの紹介のタグと説明文を見直しました']},
  {v:'0.4.0', d:'2026-11-23', items:['📱 全画面で遊べるようになりました（◁○≡は画面の下から上へスワイプで出ます）']},
  {v:'0.3.0', d:'2026-11-22', items:['🃏 選んだゲームを大きく紹介する画面になりました。左右にスワイプでも切り替えられます','🪐 LAPISが遊べるようになりました']},
  {v:'0.1.0', d:'2026-11-22', items:['🎮 ゲームの一覧ができました。アイコン1つで全部のゲームが遊べます','📝 データ送信の同意は、ここで1回答えれば全部のゲームに共通になります']}
];
var VERSION = CHANGELOG[0].v;
var NAME = 'ゲームポータル';   // the list's name (title, install screen)
/* ---- the games ---- */
var GAMES = [
  {id:'dungeon-chain', name:'Dungeon Chain', desc:'タイルをつないで、地下深くへ', tags:['🔗 一筆でつなぐ','⚔️ 冒険'], url:'/dungeon-chain/', icon:'/dungeon-chain/icon-192.png',
   lb:'#2a2119', sb:'#3a2c22', st:'#f6ead2', pb:'#d9a23a', pd:'#9c6f1f', pat:'linear-gradient(45deg,#f0c766 2px,transparent 2px),linear-gradient(-45deg,#f0c766 2px,transparent 2px)'},
  {id:'kropki', name:'KROPKI', desc:'白丸・黒丸をヒントに、数字を埋める', tags:['🔢 数字を埋める','🐈‍⬛ のんびり'], url:'/kropki/', icon:'/kropki/icon-192.png',
   lb:'#f3efe4', sb:'#efe6d2', st:'#3a332b', light:1, pb:'#56647a', pd:'#3e495a', pat:'radial-gradient(circle at 25% 25%,#2d2c2a 5px,transparent 6px),radial-gradient(circle at 75% 75%,transparent 4px,#2d2c2a 5px,#2d2c2a 7px,transparent 8px)'},
  {id:'lapis', name:'LAPIS', desc:'星を合わせて、銀河まで育てる', tags:['🪐 合体させる','🌙 チル'], url:'/lapis/', icon:'/lapis/icon-192.png',
   lb:'#141d52', sb:'#1a2566', st:'#eef3ff', pb:'#2f6fd6', pd:'#234f9e', pat:'radial-gradient(circle,rgba(201,210,240,.55) 1.2px,transparent 2px)'},
  {id:'tower-battle', name:'たわーばとる', desc:'なんでも積みあげて、ほのぼのバトル', tags:['🧱 積みあげる','🌤️ ほのぼの'], url:'/tower-battle/', icon:'/tower-battle/icon-192.png?v=2',
   lb:'#cfeaf6', sb:'#dff0f8', st:'#3b4a54', light:1, pb:'#ef8a6f', pd:'#b9543a', pat:'radial-gradient(circle,rgba(255,255,255,.85) 2.5px,transparent 3.5px)'}
];
var $ = function(id){ return document.getElementById(id); };
try { sessionStorage.setItem('tkcy3_portal', '1'); } catch(e) {}   // games opened from here skip their own install screen
function ls(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e) { return null; } }

/*TKCS-BEGIN*/
/* ===== プレイ記録の送信の同意（tkcy3.github.io の全ゲーム共通。どのゲームにも同じものが入っています） =====
   - 答えは1つだけ保存し、ポータルとすべてのゲームで共有する（どこで答えても全部に反映）
   - 送る内容が増えたら CS_VER を上げる。前の版で「同意」していた人には、新しい内容で1回だけ聞き直す
     （「送信しない」と答えた人には聞き直さない）
   - 同意していても、設定でオフ（tkcy3_share='0'）なら送らない                                   */
var TKCS = (function(){
  var KEY = 'tkcy3_consent_v1', SHARE = 'tkcy3_share', CS_VER = 2;
  var ITEMS = [
    ['Dungeon Chain', '冒険の記録（職業・到達した階・ターン数・レベル・倒した数・最長チェーン・覚えたスキルや強化・倒された相手 など）'],
    ['KROPKI', '問題をクリアしたときの記録（サイズ・難しさ・問題番号・タイム・チェックの回数）'],
    ['LAPIS', 'ゲームが終わったときの記録（点数・いちばん大きい星・手数・最大連鎖・選んだ加護・KEEPとワームホールを使った回数・プレイ時間）'],
    ['たわーばとる', 'ゲームが終わったときの記録（遊び方・お題・画像のさがし先・積んだ数・とどいた高さ・勝ち負け・まわした回数・プレイ時間）'],
    ['ゲームポータル', 'どのゲームを開いたか']
  ];
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e) { return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e) {} }
  function rec(){ try { return JSON.parse(lsGet(KEY) || 'null'); } catch(e) { return null; } }
  function write(ok){ lsSet(KEY, JSON.stringify({v:CS_VER, ok:ok ? 1 : 0, at:Date.now()})); lsSet(SHARE, ok ? '1' : '0'); }
  function agreed(){ var c = rec(); return !!(c && c.ok && (c.v || 1) >= CS_VER); }
  function needAsk(){ var c = rec(); return !c || (c.ok && (c.v || 1) < CS_VER); }
  function on(){ return agreed() && lsGet(SHARE) !== '0'; }
  /* a game that kept its own answer before the shared one existed: adopt it (an old "yes" is asked again once) */
  function adopt(ok){ if (rec() || ok === undefined || ok === null) return; lsSet(KEY, JSON.stringify({v:1, ok:ok ? 1 : 0, at:Date.now()})); }
  var css = '#tkcsOv{position:fixed;inset:0;z-index:99999;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5);padding:env(safe-area-inset-top) 0 0;font-family:inherit}'
    + '#tkcsOv.on{display:flex}'
    + '#tkcsOv .tkcs{width:100%;max-width:520px;max-height:92%;overflow-y:auto;box-sizing:border-box;padding:22px 20px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#fbf8f2;color:#2d2c2a;text-align:left;-webkit-overflow-scrolling:touch}'
    + '#tkcsOv h2{margin:0 0 10px;font-size:20px;text-align:center}'
    + '#tkcsOv p{margin:0 0 6px;font-size:15px;line-height:1.65}'
    + '#tkcsOv h3{margin:14px 0 4px;font-size:15.5px;color:#a8741a}'
    + '#tkcsOv ul{margin:0;padding-left:1.25em;font-size:14.5px;line-height:1.65}'
    + '#tkcsOv li b{font-weight:800}'
    + '#tkcsOv label{display:flex;align-items:center;gap:10px;margin:16px 0 12px;font-size:16px;font-weight:700}'
    + '#tkcsOv label input{width:24px;height:24px;margin:0;accent-color:#c98f3a}'
    + '#tkcsOv button{display:block;width:100%;border:0;font:inherit;cursor:pointer}'
    + '#tkcsOv .y{height:54px;border-radius:14px;background:#c98f3a;color:#fff;font-size:18px;font-weight:800}'
    + '#tkcsOv .y:disabled{opacity:.4}'
    + '#tkcsOv .n{margin-top:6px;padding:12px;background:none;color:#7a7670;font-size:15px;text-decoration:underline}'
    + '@media (prefers-color-scheme:dark){#tkcsOv .tkcs{background:#2f3338;color:#eceae5}#tkcsOv h3{color:#e0b060}#tkcsOv .n{color:#a5aab2}}';
  var ov = null, after = null;
  function build(){
    if (ov) return;
    var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);
    ov = document.createElement('div'); ov.id = 'tkcsOv';
    ov.innerHTML = '<div class="tkcs" role="dialog" aria-modal="true">'
      + '<h2>📝 プレイ記録の送信について</h2>'
      + '<p>より遊びやすいゲームにするため、プレイの記録を作者に送らせてください。集めた記録は<b>ゲームの調整・改善のためだけ</b>に使います。</p>'
      + '<p>ここでの答えは、ゲームポータルとすべてのゲームに共通です。</p>'
      + '<h3>送る内容</h3><ul>' + ITEMS.map(function(x){ return '<li><b>' + x[0] + '</b>：' + x[1] + '</li>'; }).join('')
      + '<li>ゲームのバージョンと、端末ごとにランダムに作られる番号（同じ端末の記録をまとめるためのもので、あなた個人とは結びつきません）</li></ul>'
      + '<h3>送らないもの</h3><ul><li>名前（冒険者名・ネット対戦の名前もふくむ）・メールアドレス・電話番号・位置情報など、個人を特定できる情報</li>'
      + '<li>チャットの中身・写真・連絡先・ほかのアプリなど、端末の中の情報</li></ul>'
      + '<h3>そのほか</h3><ul><li>記録を第三者に渡すことはありません</li><li>送るかどうかは、設定からいつでも変えられます</li><li>送らない場合も、ゲームはすべて同じように遊べます</li></ul>'
      + '<label><input type="checkbox" id="tkcsChk"><span>上記の内容を確認しました</span></label>'
      + '<button class="y" id="tkcsYes" disabled>同意して送信する</button>'
      + '<button class="n" id="tkcsNo">送信しない</button></div>';
    document.body.appendChild(ov);
    var chk = ov.querySelector('#tkcsChk'), yes = ov.querySelector('#tkcsYes');
    chk.onchange = function(){ yes.disabled = !chk.checked; };
    yes.onclick = function(){ if (chk.checked) done(true); };
    ov.querySelector('#tkcsNo').onclick = function(){ done(false); };
  }
  function done(ok){
    write(ok); ov.classList.remove('on');
    var f = after; after = null;
    try { document.dispatchEvent(new CustomEvent('tkcs', {detail:{ok:ok}})); } catch(e) {}
    if (f) f(ok);
  }
  /* show the agreement. after(ok) runs when it is answered */
  function open(cb){
    build(); after = cb || null;
    var a = agreed(), chk = ov.querySelector('#tkcsChk');
    chk.checked = a; ov.querySelector('#tkcsYes').disabled = !a;
    ov.querySelector('.tkcs').scrollTop = 0; ov.classList.add('on');
  }
  /* the settings switch. Turning it on without an agreement opens the agreement first */
  function setShare(want, cb){
    if (want && !agreed()) { open(function(ok){ if (cb) cb(ok); }); return; }
    lsSet(SHARE, want ? '1' : '0'); if (cb) cb(want);
  }
  return {ver:CS_VER, agreed:agreed, needAsk:needAsk, on:on, open:open, setShare:setShare, adopt:adopt};
})();
/*TKCS-END*/
(function adoptOld(){   // answers given inside KROPKI / Dungeon Chain before the shared answer existed
  var k = null; try { k = JSON.parse(ls('kropki-save-v1') || 'null'); } catch(e) {}
  var a = k && k.consent, b = ls('dchain_consent_v1');
  if (a === 1 || b === '1') TKCS.adopt(true); else if (a === 0 || b === '0') TKCS.adopt(false);
})();
function shareOn(){ return TKCS.on(); }

/* ---- play log (this list): which game was opened ---- */
var LOG_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSenbltEWiWROUqsu99Ciqdh7uCLVHBIC84yF_Ad0k8K8kuF9g/formResponse', LOG_ENTRY = 'entry.20824307';
function devId(){
  var v = ls('tkcy3_dev');
  if (!v) { var k = null; try { k = JSON.parse(ls('kropki-save-v1') || 'null'); } catch(e) {}
    v = ls('dchain_dev_v1') || (k && k.dev) || Math.random().toString(36).slice(2, 10); ls('tkcy3_dev', v); }
  return v;
}
function isApp(){ try { return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true; } catch(e) { return false; } }
function log(ev, game){
  if (!shareOn()) return;
  try {
    var body = new URLSearchParams(); body.append(LOG_ENTRY, JSON.stringify({v:VERSION, id:devId(), ev:ev, game:game || '', app:isApp() ? 1 : 0}));
    var ok = false; try { ok = navigator.sendBeacon && navigator.sendBeacon(LOG_URL, body); } catch(e) {}
    if (!ok) fetch(LOG_URL, {method:'POST', mode:'no-cors', body:body, keepalive:true}).catch(function(){});
  } catch(e) {}
}

/* ---- the stage + picker ---- */
$('ttl').innerHTML = GAMES.map(function(g){ return '<i style="background:' + (g.pb) + '"></i>'; }).join('') + ' ' + NAME;
$('instTtl').textContent = NAME; document.title = NAME;
function art(g){ return g.icon ? '<img src="' + g.icon + '" alt="">' : g.emoji; }
var cur = 0; (function(){ var k = ls('tkcy3_pick'); GAMES.forEach(function(g, i){ if (g.id === k) cur = i; }); if (GAMES[cur].soon) cur = 0; })();
var pick = $('pick');
GAMES.forEach(function(g, i){
  var t = document.createElement('button'); t.className = 'tile' + (g.soon ? ' soon' : '');
  t.innerHTML = '<span class="ic" style="--lb:' + g.lb + '">' + art(g) + '</span><small>' + g.name + '</small><span class="tv" id="tv_' + g.id + '"></span>';
  t.onclick = function(){ show(i); };
  pick.appendChild(t);
});
function fitNames(){
  [].forEach.call(document.querySelectorAll('.tile small'), function(el){
    var f = 12.5; el.style.fontSize = f + 'px';
    while (el.scrollWidth > el.clientWidth + 0.5 && f > 9.5){ f -= 0.5; el.style.fontSize = f + 'px'; }
  });
}
fitNames(); addEventListener('resize', fitNames); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);
function show(i, dir){
  var from = cur; cur = (i + GAMES.length) % GAMES.length; var g = GAMES[cur], st = $('stage');
  dir = dir || (cur > from ? 'r' : cur < from ? 'l' : '');
  st.style.setProperty('--sb', g.sb); st.style.setProperty('--st', g.st); st.style.setProperty('--lb', g.lb); st.style.setProperty('--pat', g.pat);
  st.classList.toggle('lightbg', !!g.light);
  st.innerHTML = (g.soon ? '<span class="soonTag">準備中</span>' : '') +
    '<div class="in ' + dir + '"><div class="art" style="margin:0 auto">' + art(g) + '</div><h2>' + g.name + '</h2><p>' + g.desc + '</p>' +
    '<div class="tags">' + g.tags.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div>' + (g.ver ? '<span class="sv">v' + g.ver + '</span>' : '') + '</div>';
  [].forEach.call(pick.children, function(t, k){ t.classList.toggle('on', k === cur); });
  var pl = $('play'); pl.disabled = !!g.soon; pl.textContent = g.soon ? 'もうすぐ遊べます' : '▶ あそぶ';
  pl.style.setProperty('--pb', g.pb); pl.style.setProperty('--pd', g.pd); pl.style.setProperty('--pt', '#fff');
  if (!g.soon) ls('tkcy3_pick', g.id);
}
show(cur);
/* each game's current version, read from the game's own page (shows whether an update is live) */
function verOf(html){
  var p = [/(?:VERSION|VER)\s*=\s*'([\d.]+)'/, /CHANGELOG\s*=\s*\[\s*\{\s*v:\s*'([\d.]+)'/, /CHANGES\s*=\s*\[\s*\[\s*'([\d.]+)'/];
  for (var i = 0; i < p.length; i++) { var m = html.match(p[i]); if (m) return m[1]; }
  return null;
}
GAMES.forEach(function(g, i){
  if (!g.url) return;
  fetch(g.url, {cache:'no-cache'}).then(function(r){ return r.ok ? r.text() : ''; }).then(function(h){
    var v = verOf(h); if (!v) return;
    g.ver = v; $('tv_' + g.id).textContent = 'v' + v;
    if (i === cur) show(cur, 'none');
  }).catch(function(){});
});
$('play').onclick = function(){ var g = GAMES[cur]; if (g.soon) return; log('launch', g.id); location.href = g.url; };
(function(){   // swipe the stage to flip through games
  var x0 = null, y0 = 0, st = $('stage');
  st.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, {passive:true});
  st.addEventListener('touchend', function(e){ if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) show(cur + (dx < 0 ? 1 : -1), dx < 0 ? 'r' : 'l'); }, {passive:true});
})();
$('ver').innerHTML = '<button id="verBtn"></button>';

/* ---- overlays ---- */
function open(id){ $(id).classList.add('on'); }
function close(id){ $(id).classList.remove('on'); }
function openConsent(after){ TKCS.open(function(ok){ if (after) after(); if (ok) log('open'); }); }

function renderSet(){ [].forEach.call($('shareSeg').children, function(b){ b.classList.toggle('on', (b.dataset.v === '1') === shareOn()); }); }
$('setBtn').onclick = function(){ renderSet(); open('setOv'); };
$('setClose').onclick = function(){ close('setOv'); };
$('setOv').onclick = function(e){ if (e.target === this) close('setOv'); };
[].forEach.call($('shareSeg').children, function(b){ b.onclick = function(){
  TKCS.setShare(b.dataset.v === '1', renderSet);
}; });
$('csInfo').onclick = function(){ openConsent(renderSet); };
/* ---- version & changelog (same look as KROPKI / Dungeon Chain / LAPIS) ---- */
function chgByDay(){ var out = []; CHANGELOG.forEach(function(c){ var g = out.filter(function(x){ return x.d === c.d; })[0]; if (!g) { g = {d:c.d, items:[]}; out.push(g); } g.items = g.items.concat(c.items); }); return out; }
function verUnseen(){ var v = ls('tkcy3_portal_seen_ver'); if (v === VERSION) return false; if (!v) { ls('tkcy3_portal_seen_ver', VERSION); return false; } return true; }
function refreshVer(){ var n = verUnseen(), b = $('verBtn'); b.textContent = 'v' + VERSION + (n ? ' ・ 更新内容を見る' : ''); b.classList.toggle('new', n); $('stVerNo').textContent = VERSION; $('stVerNew').classList.toggle('hidden', !n); }
var chgBack = null;
function openCl(back){
  ls('tkcy3_portal_seen_ver', VERSION); refreshVer();
  var top = CHANGELOG[0];
  var days = chgByDay().map(function(g){ return {d:g.d, items:g.items.filter(function(x){ return top.items.indexOf(x) < 0; })}; }).filter(function(g){ return g.items.length; });
  var ul = function(items){ return '<ul>' + items.map(function(x){ return '<li>' + x + '</li>'; }).join('') + '</ul>'; };
  var dt = function(d){ return d.slice(5).replace('-', '/'); };
  $('chgVer').textContent = 'v' + VERSION;
  $('chgBody').innerHTML = '<h3>✨ ' + dt(top.d) + '</h3>' + ul(top.items) + days.map(function(g){ return '<details><summary>' + dt(g.d) + '</summary>' + ul(g.items) + '</details>'; }).join('');
  chgBack = back || null; open('clOv');
}
function clDone(){ close('clOv'); var f = chgBack; chgBack = null; if (f) f(); }
$('clInfo').onclick = function(){ close('setOv'); openCl(function(){ renderSet(); open('setOv'); }); };
$('verBtn').onclick = function(){ openCl(); };
$('clClose').onclick = clDone;
$('clOv').onclick = function(e){ if (e.target === this) clDone(); };
refreshVer();

/* ---- tell someone about the portal: the phone's share sheet, or copy the link ---- */
var SHARE = {title:'ゲームポータル', text:'スマホで遊べるパズルゲーム集です。ホーム画面に追加して遊べます。', url:'https://tkcy3.github.io/'};
var toastT = null;
function toast(msg){ var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('on'); }, 2600); }
function copyLink(){
  var txt = SHARE.text + '\n' + SHARE.url;
  var done = function(){ toast('🔗 リンクをコピーしました'); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, function(){ toast(SHARE.url); });
  else toast(SHARE.url);
}
function sharePortal(){
  log('share');
  if (navigator.share) navigator.share(SHARE).catch(function(e){ if (!e || e.name !== 'AbortError') copyLink(); });
  else copyLink();
}
$('shareBtn').onclick = sharePortal;
$('shareRow').onclick = function(){ close('setOv'); sharePortal(); };

/* ---- add to home screen ---- */
var A2H = null;
addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); A2H = e; });
addEventListener('appinstalled', function(){ A2H = null; instDone(); });
function ios(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function steps(){ return ios() ? '<div class="a2h"><b>⬆️ 共有</b>›<b>➕ ホーム画面に追加</b></div><p class="a2note">Safariの下の ⬆️ から</p>'
                              : '<div class="a2h"><b>⋮</b>›<b>📲 ホーム画面に追加</b></div><p class="a2note">Chromeの右上 ⋮ から</p>'; }
function instDone(){ if (!$('inst').classList.contains('on')) return; $('instGo').style.display = 'none';
  $('instSteps').innerHTML = '<div class="a2h"><b>✅ 追加しました</b></div><p class="a2note">ホーム画面の「' + NAME + '」から開いてください</p>'; $('instSkip').textContent = 'このままブラウザで遊ぶ'; }
$('instGo').onclick = function(){
  if (A2H) { var e = A2H; A2H = null; e.prompt(); e.userChoice.then(function(r){ if (r && r.outcome === 'accepted') instDone(); else $('instSteps').innerHTML = steps(); }).catch(function(){}); return; }
  $('instSteps').innerHTML = steps();
};
$('instSkip').onclick = function(){ close('inst'); next(); };

/* first launch: (add to home) → consent → list */
function next(){ if (TKCS.needAsk()) openConsent(); else log('open'); }
if (location.protocol === 'https:' && !isApp()) open('inst'); else next();

if ('serviceWorker' in navigator) addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
})();
</script>
</body>
